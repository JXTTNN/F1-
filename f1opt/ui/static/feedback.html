<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F1 2026 调教分析</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--panel:#181b22;--line:#2a2e38;--txt:#e0e4ec;--dim:#6b7280;
  --muted:#8a909c;--cyan:#00e5ff;--green:#22c55e;--amber:#f59e0b;--red:#ff2d2d;
  --purple:#a78bfa;--accent:#f97316
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--txt);font-size:13px;line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.title{font-size:16px;font-weight:700}.title .accent{color:var(--cyan)}
.btn{padding:6px 14px;border:none;border-radius:5px;font-size:12px;font-weight:600;cursor:pointer;color:#fff}
.btn.primary{background:var(--cyan);color:#000}
.btn.cyan{background:var(--purple)}
.btn.small{padding:3px 9px;font-size:11px}
main{max-width:960px;margin:0 auto;padding:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.panel h2{font-size:14px;margin-bottom:10px;color:var(--cyan);border-bottom:1px solid var(--line);padding-bottom:6px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.row label{font-size:11px;color:var(--dim)}
textarea,input[type=text],select{background:var(--bg);border:1px solid var(--line);border-radius:4px;color:var(--txt);font-size:12px;padding:6px 10px}
textarea{width:100%;min-height:60px;resize:vertical}
select{padding:5px 8px}
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.setup-group h3{margin:0 0 6px;font-size:11px;color:var(--cyan);letter-spacing:.6px;border-bottom:1px solid var(--line);padding-bottom:3px}
.setup-group .row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;margin:0}
.setup-group .row .name{color:var(--muted)}
.setup-group .row input.val{width:60px;background:var(--bg);border:1px solid var(--line);border-radius:3px;color:var(--txt);font-size:12px;text-align:right;padding:2px 4px}
.setup-group .row .u{color:var(--dim);font-size:10px;margin-left:2px}
.result-card{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.result-card .lbl{font-size:10px;color:var(--dim);display:block;margin-bottom:2px}
.result-card .val{font-size:15px;font-weight:700}
.result-card .val.pos{color:var(--green)}
.sugg{border-left:3px solid var(--cyan);padding:6px 10px;margin:6px 0;background:var(--bg);border-radius:0 4px 4px 0}
.sugg .pname{font-weight:600;color:var(--cyan)}
.sugg .gain{color:var(--green);font-size:11px;margin-left:8px}
.sugg .arrow{color:var(--amber)}
.sugg .reason{font-size:11px;color:var(--muted);margin-top:2px}
.summary{font-size:12px;color:var(--txt);padding:8px 12px;background:var(--bg);border-radius:4px;line-height:1.6;white-space:pre-wrap}
.empty{color:var(--dim);font-size:12px;text-align:center;padding:20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:8px 20px;border-radius:6px;font-size:12px;z-index:999;opacity:0;transition:opacity .2s}
.toast.show{opacity:1}
@media(max-width:520px){.setup-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="title">F1 2026 <span class="accent">调教分析</span></div>
  <div><a href="/" style="font-size:12px;color:var(--cyan);text-decoration:none">&#8592; 实时面板</a></div>
</header>
<main>
<section class="panel">
  <h2>赛道选择</h2>
  <div class="row">
    <select id="track-select"></select>
    <span id="track-info" style="font-size:11px;color:var(--dim)">—</span>
  </div>
</section>

<section class="panel">
  <h2>车手反馈</h2>
  <textarea id="fb-input" placeholder="描述你的问题，如：T1 入弯推头严重，车尾在出弯时很松，中速弯抓不住地…"></textarea>
  <div class="row" style="margin-top:8px">
    <button id="fb-btn" class="btn primary">分析反馈</button>
    <span id="fb-status" style="font-size:11px;color:var(--dim)"></span>
  </div>
  <div id="fb-result" style="display:none;margin-top:12px">
    <div class="summary" id="fb-summary"></div>
    <div id="fb-suggestions" style="margin-top:8px"></div>
  </div>
</section>

<section class="panel">
  <h2>当前调教 <span style="font-size:11px;color:var(--dim);margin-left:8px">— 可直接编辑数值</span></h2>
  <div id="setup-container" class="setup-grid"></div>
  <div class="row" style="margin-top:10px">
    <button id="predict-btn" class="btn primary">预测圈速</button>
    <span id="predict-out" style="font-size:14px;font-weight:700;color:var(--cyan)"></span>
  </div>
</section>

<section class="panel">
  <h2>搜索最优调教</h2>
  <div class="row">
    <label>迭代 <input id="search-iter" type="number" value="80" min="10" max="200" style="width:56px"></label>
    <label>风格 <select id="driver-style"><option value="default">默认</option><option value="aggressive">激进</option><option value="conservative">稳健</option></select></label>
    <label>胎耗 <select id="tire-wear"><option value="0">关闭</option><option value="1">低</option><option value="2">中</option><option value="3">高</option></select></label>
    <button id="search-btn" class="btn primary">搜索</button>
    <span id="search-status" style="font-size:11px;color:var(--dim)"></span>
  </div>
  <div id="search-result" style="display:none;margin-top:10px">
    <div class="result-card" style="margin-bottom:8px"><span class="lbl">圈速增益</span><span id="sr-gain" class="val pos">—</span></div>
    <div id="search-setup-container" class="setup-grid"></div>
    <div class="row" style="margin-top:8px">
      <button id="apply-btn" class="btn cyan">应用推荐调教</button>
      <button id="export-btn" class="btn primary small">导出 JSON</button>
    </div>
  </div>
</section>
</main>
<div id="toast" class="toast"></div>
<script>
function el(id){return document.getElementById(id);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
var SETUP_GROUPS=[{group:"空气动力学",fields:[{name:"front_wing",label:"前翼",unit:"clicks"},{name:"rear_wing",label:"后翼",unit:"clicks"}]},{group:"主动空动",fields:[{name:"active_aero_mode",label:"主动空动",unit:"mode"},{name:"x_mode_activations",label:"X-Mode 激活",unit:"count"}]},{group:"传动",fields:[{name:"on_throttle_diff",label:"油门差速",unit:"%"},{name:"off_throttle_diff",label:"收油差速",unit:"%"},{name:"engine_braking",label:"发动机制动",unit:"%"}]},{group:"悬挂几何",fields:[{name:"front_camber",label:"前轮外倾",unit:"°"},{name:"rear_camber",label:"后轮外倾",unit:"°"},{name:"front_toe",label:"前轮前束",unit:"°"},{name:"rear_toe",label:"后轮前束",unit:"°"}]},{group:"悬挂",fields:[{name:"front_suspension",label:"前弹簧",unit:"clicks"},{name:"rear_suspension",label:"后弹簧",unit:"clicks"},{name:"front_arb",label:"前防倾杆",unit:"clicks"},{name:"rear_arb",label:"后防倾杆",unit:"clicks"},{name:"front_ride_height",label:"前离地",unit:"clicks"},{name:"rear_ride_height",label:"后离地",unit:"clicks"}]},{group:"制动",fields:[{name:"brake_pressure",label:"制动压力",unit:"%"},{name:"front_brake_bias",label:"前制动力",unit:"%"}]},{group:"轮胎",fields:[{name:"front_tyre_pressure",label:"前胎压",unit:"psi"},{name:"rear_tyre_pressure",label:"后胎压",unit:"psi"}]},{group:"燃油",fields:[{name:"ballast",label:"配重",unit:"clicks"},{name:"fuel_load",label:"燃油",unit:"kg"}]}];
var state={tracks:[],currentTrackId:"melbourne",setup:{},frames:[],_lastSearch:null};
async function fetchJSON(url,opts){var r=await fetch(url,opts||{});if(!r.ok){var d="";try{var j=await r.json();d=j.detail||JSON.stringify(j)}catch(e){try{d=await r.text()}catch(e2){}}throw new Error(r.status+" "+r.statusText+(d?": "+d:""))}return r.json();}
function showToast(msg){var t=el("toast");t.textContent=msg;t.classList.add("show");setTimeout(function(){t.classList.remove("show")},2500);}
function populateTracks(sel){state.tracks.forEach(function(t){var o=document.createElement("option");o.value=t.track_id;o.textContent="R"+t.round_number+" · "+(t.name_cn||t.circuit_name);sel.appendChild(o);});}
async function loadTracks(){try{var d=await fetchJSON("/api/tracks");state.tracks=d.tracks||[];var s=el("track-select");s.innerHTML="";populateTracks(s);if(state.tracks.length){s.value=state.currentTrackId;renderTrackInfo();}}catch(e){showToast("赛道加载失败: "+e.message)}}
function renderTrackInfo(){var t=null;for(var i=0;i<state.tracks.length;i++){if(state.tracks[i].track_id===state.currentTrackId){t=state.tracks[i];break;}}el("track-info").textContent=t?(t.country_cn||t.country)+" · "+(t.length_m/1000).toFixed(3)+" km · "+t.corners+" 弯":"";}
el("track-select").addEventListener("change",function(){state.currentTrackId=this.value;renderTrackInfo();});
async function loadSetup(){try{state.setup=await fetchJSON("/api/setup/default");renderSetup();}catch(e){el("setup-container").innerHTML='<div class="empty">默认调教不可用</div>'}}
function renderSetup(cid,so){cid=cid||"setup-container";var s=so||state.setup;var c=el(cid);c.innerHTML="";SETUP_GROUPS.forEach(function(g){var div=document.createElement("div");div.className="setup-group";var h=document.createElement("h3");h.textContent=g.group;div.appendChild(h);g.fields.forEach(function(f){var v=s[f.name];var row=document.createElement("div");row.className="row";var vs=(v===undefined||v===null)?"":String(v);row.innerHTML='<span class="name">'+f.label+'</span><input class="val" type="number" step="any" data-field="'+f.name+'" value="'+esc(vs)+'"><span class="u">'+f.unit+'</span>';div.appendChild(row);});c.appendChild(div);});c.querySelectorAll('input[data-field]').forEach(function(inp){inp.addEventListener('change',function(){var fn=this.getAttribute('data-field');var v=parseFloat(this.value);if(!isNaN(v))s[fn]=v;});});}
function fmtVal(v){if(v===null||v===undefined)return"—";var n=Number(v);if(isNaN(n))return String(v);return Math.abs(n)>=100?n.toFixed(0):n.toFixed(2);}
function fmtTime(s){if(s===null||s===undefined||isNaN(s))return"—";var t=Number(s);if(!isFinite(t)||t<=0)return"—";var m=Math.floor(t/60);return(m>0?m+":":"")+(t-m*60).toFixed(3);}
async function runFeedback(){var btn=el("fb-btn");btn.disabled=true;el("fb-status").textContent="分析中…";var q=el("fb-input").value.trim()||null;var body={frames:state.frames.slice(-600),setup:state.setup,track_id:state.currentTrackId,driver_style:"default"};if(q)body.question=q;try{var r=await fetchJSON("/api/feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});el("fb-result").style.display="block";el("fb-summary").textContent=r.summary||"(无摘要)";var sugs=r.setup_suggestions||[];var sc=el("fb-suggestions");sc.innerHTML="";sugs.forEach(function(s){var div=document.createElement("div");div.className="sugg";div.innerHTML='<div><span class="pname">'+esc(s.name)+'</span><span class="gain">'+esc(s.expected_gain||"")+'</span></div><div style="font-size:12px">'+fmtVal(s.before)+' <span class="arrow">&#8594;</span> '+fmtVal(s.after)+' <span style="color:var(--dim);font-size:10px">'+esc(s.unit||"")+'</span></div><div class="reason">'+esc(s.reason||"")+'</div>';sc.appendChild(div);});el("fb-status").textContent="";}catch(e){el("fb-status").textContent="";showToast("反馈分析失败: "+e.message)}finally{btn.disabled=false;}}
async function predict(){var body={setup:state.setup,track_id:state.currentTrackId};try{var r=await fetchJSON("/api/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});el("predict-out").textContent="预测圈速 "+fmtTime(r.predicted_lap_time);}catch(e){showToast("预测失败: "+e.message)}}
async function runSearch(){var btn=el("search-btn");btn.disabled=true;el("search-status").textContent="搜索中…";var body={track_id:state.currentTrackId,iterations:parseInt(el("search-iter").value)||80,driver_style:el("driver-style").value,tire_wear_weight:parseFloat(el("tire-wear").value)||0};try{var r=await fetchJSON("/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});el("search-result").style.display="block";var gain=r.predicted_gain_s||0;el("sr-gain").textContent=(gain>=0?"+":"")+gain.toFixed(3)+" s";el("sr-gain").className="val "+(gain>0?"pos":"neg");if(r.recommended){renderSetup("search-setup-container",r.recommended);state._lastSearch=r;}el("search-status").textContent="";}catch(e){el("search-status").textContent="";showToast("搜索失败: "+e.message)}finally{btn.disabled=false;}}
function applySearch(){if(!state._lastSearch||!state._lastSearch.recommended){showToast("请先搜索");return;}state.setup=state._lastSearch.recommended;renderSetup();showToast("已应用推荐调教");}
function exportSetup(){var data={format:"f1-25-setup-v1",groups:[]};SETUP_GROUPS.forEach(function(g){var fs=[];g.fields.forEach(function(f){fs.push({name:f.name,value:state.setup[f.name],unit:f.unit});});data.groups.push({group:g.group,fields:fs});});var a=document.createElement("a");a.href="data:application/json,"+encodeURIComponent(JSON.stringify(data,null,2));a.download="f1-setup-"+state.currentTrackId+".json";a.click();}
el("fb-btn").addEventListener("click",runFeedback);el("predict-btn").addEventListener("click",predict);el("search-btn").addEventListener("click",runSearch);el("apply-btn").addEventListener("click",applySearch);el("export-btn").addEventListener("click",exportSetup);loadTracks().then(function(){loadSetup();});
</script>
</body>
</html>
