name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check setup_tuner/ tests/

      - name: Test (pytest)
        run: pytest tests/ -v --timeout=30

      # 使用流程冒烟：调教模型必须在真实调用路径上「跑起来」（覆盖 / 采纳 /
      # 不越界）。这里只跑 3 条赛道且不设门禁（红线只留一条），
      # 加严的门禁在 Retrain Models 的发布前评测里。
      - name: Usage flow smoke
        run: python scripts/eval_usage_flow.py --quick
