name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint-type-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
        exclude:
          - os: windows-latest
            python-version: "3.10"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov slowapi

      - name: Lint (ruff)
        run: ruff check f1opt tests scripts

      - name: Type check (mypy)
        run: mypy f1opt || true
        continue-on-error: true

      - name: Test (pytest + coverage)
        run: |
          pytest tests/ --cov=f1opt --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=html --cov-branch --cov-fail-under=70 -ra --tb=short -n auto || true
        continue-on-error: ${{ matrix.os == 'windows-latest' }}

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            coverage.xml
            htmlcov/

  smoke-test-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-type-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: CLI smoke test
        run: |
          f1opt --help
          f1opt tracks list --json | head -20
          f1opt setup default --json
          f1opt feedback --list-examples --json | head -20
          f1opt predict --track suzuka --setup-json '{"front_wing":30,"rear_wing":25,"on_throttle_diff":80,"off_throttle_diff":50,"front_suspension":5,"rear_suspension":5,"front_arb":5,"rear_arb":5,"front_tyre_pressure":23,"rear_tyre_pressure":21,"front_camber":-3.0,"rear_camber":-1.5,"front_toe":0.05,"rear_toe":0.15,"front_ride_height":5,"rear_ride_height":5,"front_brake_bias":50,"brake_pressure":90,"fuel_load":30}'

  api-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-type-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install slowapi

      - name: API health check
        run: |
          f1opt serve --host 127.0.0.1 --port 8011 &
          SERVER_PID=$!
          sleep 3
          curl -sSf http://127.0.0.1:8011/api/health
          curl -sSf http://127.0.0.1:8011/api/tracks | head -c 200
          curl -sSf http://127.0.0.1:8011/api/setup/default | head -c 200
          kill $SERVER_PID
