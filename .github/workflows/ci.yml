name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test (fast subset)
        # 全量套件 (~3500 用例, torch 物理仿真) 较重; CI 跑核心快测保证
        # 「无错误」持续反馈, 全量验证在本地执行。
        run: >
          pytest tests/test_cli.py tests/data/test_tracks.py
          tests/data/test_setup_schema.py tests/ui/test_dashboard.py
          tests/api/test_app.py -q
