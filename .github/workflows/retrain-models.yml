name: Retrain Models

# 云端重训调教模型：补拉 2026 遥测（含历史"无数据"会话重新探测）
# → 逐弯数据集 → 仿真数据集 → 训练两个 NN → 模型提交回仓库。
# 触发：手动 dispatch；push 触及抓取/数据集脚本；或每 6 小时定时续抓。
# 注意：本工作流文件自身的改动不触发（避免"工作流+脚本"成对提交时双跑）；
#       更新本文件后请手动 dispatch，或与脚本改动一并提交。
#
# 为什么必须有定时续抓：
#   ① 遥测缓存（.ref/tracing_2026）不入库，数据集（data/training）也不入库，
#      所以每次重训都得先把语料抓一遍；
#   ② 单次 job 有超时上限，一轮抓不完 23 个分站；
#   ③ GitHub Actions 缓存 7 天不访问即被清除。
#   抓取是按文件续传的（已存在即跳过），因此多轮累积即可补齐；本轮没补齐时
#   下面的「无回退守卫」会保留旧模型正常结束，下一轮接着抓。

on:
  workflow_dispatch:
    inputs:
      skip_surrogate:
        description: "跳过遥测代理模型训练（只重训调教性能模型，快速验证训练侧改动）"
        type: boolean
        default: false
  schedule:
    # 每 6 小时一次（UTC，错开整点）。新分站产生数据后无需人工介入即可补抓。
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/fetch_official_2026.py"
      - "scripts/build_corner_dataset.py"
      # 训练管线本身的改动也必须重训：否则改了采样/模型却要等 6 小时定时任务，
      # 很容易误以为“改了但没生效”。
      - "scripts/build_setup_sim_dataset.py"
      - "scripts/train_setup_sim_nn.py"
      - "scripts/eval_setup_sim.py"
      - "scripts/eval_usage_flow.py"
      - "scripts/eval_style_targeting.py"

permissions:
  contents: write
  actions: write   # 供下面清理旧遥测缓存使用

concurrency:
  group: retrain-models
  cancel-in-progress: false

jobs:
  retrain:
    name: "fetch → build → train → commit"
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史：下面的提交步骤要在运行期间 main 前进后 rebase 再推送。
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # 必须在训练覆盖模型文件之前记录当前覆盖，供后面的「无回退守卫」比对。
      # 注意要放在 setup-python 之后：Ubuntu runner 上没有裸 `python`。
      - name: Snapshot previous model coverage
        id: prevcov
        run: |
          python -c "import json;print('n='+str(len(json.load(open('setup_tuner/resources/models/setup_sim_nn.json'))['track_ids'])))" >> "$GITHUB_OUTPUT"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Restore telemetry cache
        uses: actions/cache/restore@v4
        with:
          path: .ref/tracing_2026
          key: tracing-2026-${{ github.run_id }}
          restore-keys: tracing-2026-

      # 遥测缓存约 7.6 GB，仓库缓存上限只有 10 GB；本工作流每轮都写一个
      # tracing-2026-<run_id> 新键，两轮叠加就超限，可能把需要续抓的那份挤掉，
      # 造成「永远从零重抓」。恢复完（数据已在磁盘）先清旧键，保证任何时刻只有一份。
      # continue-on-error：清理只是优化，权限/接口异常绝不能让抓取停摆。
      - name: Prune stale telemetry caches
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/actions/caches?per_page=100" \
                  --jq '.actions_caches[] | select(.key|startswith("tracing-2026-")) | .id' || true)
          for id in $ids; do
            echo "删除旧遥测缓存 id=$id"
            gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" >/dev/null || true
          done
          echo "--- 剩余遥测缓存 ---"
          gh api "repos/${{ github.repository }}/actions/caches?per_page=100" \
                  --jq '.actions_caches[] | "\(.key) \(.size_in_bytes)"' || true

      - name: Fetch 2026 telemetry (resume + refresh absent)
        run: |
          python scripts/fetch_official_2026.py --full --refresh-absent \
            --max-minutes 110 --workers 12

      # 关键：无论抓取步骤成败都保存缓存（if: always()）。
      # 上一版用 actions/cache@v4 的隐式 post-save（默认仅 success 时执行），
      # 抓取一崩 7.6 GB 的已下载数据全部丢失，重跑只能从零开始。
      - name: Save telemetry cache (always)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ref/tracing_2026
          key: tracing-2026-${{ github.run_id }}

      # 抓取进度写进日志：哪几站已抓、哪几站还没轮到，一眼可见。
      - name: Crawl progress
        if: always()
        run: |
          python scripts/fetch_official_2026.py --status || true
          echo "--- 有数据的分站目录数 ---"
          if [ -d .ref/tracing_2026 ]; then
            ls -1 .ref/tracing_2026 | grep -v '^_' | wc -l
          else
            echo 0
          fi

      - name: Build corner dataset
        run: python scripts/build_corner_dataset.py

      - name: Build setup-sim dataset
        run: python scripts/build_setup_sim_dataset.py

      - name: Train setup-sim NN
        run: python scripts/train_setup_sim_nn.py

      # 决策能力评测：训练集/验证集的 val_mae 量的是「任意随机调教有多慢」的
      # 插值误差，而调优的真实决策是「两套都已经不错的调教，哪套快几十毫秒」。
      # 这里用训练时未见过的新鲜样本量化后者，并把报告写进随包资源。
      # 不在此步 fail：先让报告落盘，由提交步骤决定是否发布新模型。
      - name: Evaluate setup-sim NN (decision metrics)
        id: evalsim
        run: |
          python scripts/eval_setup_sim.py || true
          passed=$(python -c "import json;print(1 if json.load(open('setup_tuner/resources/models/setup_sim_eval.json'))['gate']['passed'] else 0)" 2>/dev/null || echo 0)
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('setup_tuner/resources/models/setup_sim_eval.json'))
          m = d['metrics']
          print('## 调教性能模型评测\n')
          print('| 指标 | 值 | 门槛 | 结论 |')
          print('|---|---|---|---|')
          for k, c in d['gate']['checks'].items():
              print(f"| {k} | {c['value']} | {c['threshold']} | {'PASS' if c['ok'] else 'FAIL'} |")
          print(f"\n真实跑圈样本：{d['labels']['real_setup_laps']}\n")
          PY

      # 使用流程评测：eval_setup_sim 量的是「对仿真器的保真度」，这里量的是
      # 「用户点了生成之后到底拿到了什么」—— 24 赛道 × 5 场景直接走
      # engine.generate_suggestion（与 POST /api/v1/suggest 同路径），
      # 统计模型生效率 / 采纳率 / 收益 / 越界与胎压对称。
      # 覆盖不到、采纳不了、夹越界 —— 任何一条不达标都不该发布新模型。
      - name: Evaluate usage flow (per-track end-to-end)
        id: evalusage
        run: |
          python scripts/eval_usage_flow.py || true
          passed=$(python -c "import json;print(1 if json.load(open('setup_tuner/resources/models/usage_flow_eval.json'))['gate']['passed'] else 0)" 2>/dev/null || echo 0)
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('setup_tuner/resources/models/usage_flow_eval.json'))
          m = d['metrics']
          print('## 使用流程评测（用户实际拿到什么）\n')
          print('| 指标 | 值 | 门槛 | 结论 |')
          print('|---|---|---|---|')
          for k, c in d['gate']['checks'].items():
              print(f"| {k} | {c['value']} | {c['threshold']} | {'PASS' if c['ok'] else 'FAIL'} |")
          print(f"\n覆盖不到的赛道：{m['tracks_without_model']}\n")
          PY

      # 风格定向评测：换模型后必须重新确认「同一份遥测、换一种开法，建议确实不同」。
      # 风格层每条动作都要过同一张性能模型算圈速代价，模型一换，代价分布就变，
      # 上一版的 style_flow_eval 立刻失效 —— 之前正是漏了这一步，每次重训后
      # 随包的风格报告都还描述着上一版模型，只能靠人工再补一次提交。
      - name: Evaluate style targeting (per driving style)
        id: evalstyle
        run: |
          python scripts/eval_style_targeting.py || true
          passed=$(python -c "import json;print(1 if json.load(open('setup_tuner/resources/models/style_flow_eval.json'))['gate']['passed'] else 0)" 2>/dev/null || echo 0)
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open('setup_tuner/resources/models/style_flow_eval.json'))
          print('## 风格定向评测（同一遥测、不同开法）\n')
          print('| 指标 | 值 | 门槛 | 结论 |')
          print('|---|---|---|---|')
          for k, c in d['gate']['checks'].items():
              print(f"| {k} | {c['value']} | {c['threshold']} | {'PASS' if c['ok'] else 'FAIL'} |")
          print()
          PY

      # 把三道门禁的判定拍成快照留在 .ci/ 里：这样即使后面「无回退守卫」
      # 回滚了模型、或者提交步骤挂了，失败诊断（ci_diag.sh）里也能看到
      # 「到底哪一项没过」，不用再翻 Step Summary。
      - name: Gate summary snapshot
        if: always()
        run: |
          mkdir -p .ci
          python - <<'PY' 2>&1 | tee .ci/gate.log
          import json
          import pathlib

          for name in ("setup_sim_eval", "usage_flow_eval", "style_flow_eval"):
              p = pathlib.Path("setup_tuner/resources/models") / f"{name}.json"
              if not p.exists():
                  print(f"{name}: <缺失>")
                  continue
              d = json.loads(p.read_text(encoding="utf-8"))
              g = d.get("gate", {})
              print(f"== {name}  passed={g.get('passed')}")
              for k, c in g.get("checks", {}).items():
                  print(f"  {k}: {c.get('value')} (门槛 {c.get('threshold')}) "
                        f"-> {'PASS' if c.get('ok') else 'FAIL'}")
          PY
          true

      - name: Train telemetry surrogate
        if: github.event.inputs.skip_surrogate != 'true'
        run: |
          set -o pipefail
          mkdir -p .ci
          python scripts/train_telemetry_surrogate.py 2>&1 | tee .ci/surrogate.log

      - name: Coverage report
        run: |
          python - <<'PY'
          import json
          sim = json.load(open('setup_tuner/resources/models/setup_sim_nn.json'))
          tsur = json.load(open('setup_tuner/resources/models/telemetry_surrogate.json'))
          print('setup_sim_nn 覆盖赛道:', len(sim['track_ids']))
          print(sorted(sim['track_ids']))
          print('telemetry_surrogate 覆盖赛道:', len(tsur['corner_head']['tracks']))
          print(sorted(tsur['corner_head']['tracks']))
          PY

      # 无回退守卫（替代旧的「>= 13 基线」硬门槛）。
      # 旧门槛两个致命缺陷：① 13 远低于实际覆盖（17 站），某轮只抓到 15 站时
      # 模型会「合法地」退化成 15 站并被提交；② 语料没补齐时训练纯属浪费。
      # 现改为与「本轮训练前」的覆盖比对：低于就回滚模型文件、跳过提交、正常结束。
      # 遥测缓存已在前面 if: always() 保存，下一轮定时任务接着续抓。
      - name: Coverage guard (no regression)
        id: guard
        run: |
          PREV="${{ steps.prevcov.outputs.n }}"
          NEW=$(python -c "import json;print(len(json.load(open('setup_tuner/resources/models/setup_sim_nn.json'))['track_ids']))")
          echo "训练前覆盖 ${PREV} 站 → 本轮覆盖 ${NEW} 站"
          if [ "$NEW" -lt "$PREV" ]; then
            git checkout -- setup_tuner/resources/models/
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::warning title=语料未补齐，已保留旧模型::本轮只覆盖 ${NEW} 站（现有 ${PREV} 站），未提交。遥测缓存已保存，下一轮定时任务继续续抓，累计覆盖达到 ${PREV} 站以上时自动训练并提交。"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit retrained models
        if: steps.guard.outputs.ok == '1'
        run: |
          mkdir -p .ci
          exec > >(tee -a .ci/commit.log) 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          EVAL_PASS="${{ steps.evalsim.outputs.passed }}"
          USAGE_PASS="${{ steps.evalusage.outputs.passed }}"
          STYLE_PASS="${{ steps.evalstyle.outputs.passed }}"
          if [ "$EVAL_PASS" = "1" ] && [ "$USAGE_PASS" != "1" ]; then
            echo "::warning title=使用流程评测未通过::模型在真实使用路径上未达标（覆盖/采纳/越界），已保留旧模型，报告写入 eval_rejected/"
            EVAL_PASS=0
          fi
          # 风格定向同样算发布门禁：风格层要拿这张模型算每条动作的圈速代价，
          # 模型退化会让「按开法微调」变成「随机乱改」或直接全部拒绝。
          if [ "$EVAL_PASS" = "1" ] && [ "$STYLE_PASS" != "1" ]; then
            echo "::warning title=风格定向评测未通过::换模型后风格动作失效或代价超预算，已保留旧模型，报告写入 eval_rejected/"
            EVAL_PASS=0
          fi
          # 评测不达标就不发布新模型（旧模型继续服务）。关键：把报告挪到
          # eval_rejected/ 而不是留在正式路径 —— 正式路径的报告必须永远描述
          # 「当前随包发布的那一版模型」，否则读报告的人会被误导。
          if [ "$EVAL_PASS" = "1" ]; then
            git add setup_tuner/resources/models/setup_sim_nn.json \
                    setup_tuner/resources/models/telemetry_surrogate.json \
                    setup_tuner/resources/models/setup_sim_eval.json \
                    setup_tuner/resources/models/setup_sim_eval.md \
                    setup_tuner/resources/models/usage_flow_eval.json \
                    setup_tuner/resources/models/usage_flow_eval.md \
                    setup_tuner/resources/models/style_flow_eval.json \
                    setup_tuner/resources/models/style_flow_eval.md
          else
            REJ=setup_tuner/resources/models/eval_rejected
            mkdir -p "$REJ"
            cp setup_tuner/resources/models/setup_sim_eval.json "$REJ/" 2>/dev/null || true
            cp setup_tuner/resources/models/setup_sim_eval.md "$REJ/" 2>/dev/null || true
            cp setup_tuner/resources/models/usage_flow_eval.json "$REJ/" 2>/dev/null || true
            cp setup_tuner/resources/models/usage_flow_eval.md "$REJ/" 2>/dev/null || true
            cp setup_tuner/resources/models/style_flow_eval.json "$REJ/" 2>/dev/null || true
            cp setup_tuner/resources/models/style_flow_eval.md "$REJ/" 2>/dev/null || true
            rm -f setup_tuner/resources/models/setup_sim_eval.json \
                  setup_tuner/resources/models/setup_sim_eval.md \
                  setup_tuner/resources/models/usage_flow_eval.json \
                  setup_tuner/resources/models/usage_flow_eval.md \
                  setup_tuner/resources/models/style_flow_eval.json \
                  setup_tuner/resources/models/style_flow_eval.md
            git checkout -- setup_tuner/resources/models/setup_sim_nn.json \
                            setup_tuner/resources/models/telemetry_surrogate.json || true
            git add "$REJ"
          fi
          pushed=0
          if git diff --cached --quiet; then
            echo '模型与评测均无变化，跳过提交'
            pushed=1
          else
            if [ "$EVAL_PASS" = "1" ]; then
              git commit -m "retrain: 补拉缺失赛道遥测并重训模型（云端）"
            else
              # 提交内容只有 eval_rejected/ 的拒绝样本，说明这轮模型没上岗。
              # 消息必须写清，否则历史看起来像「模型更新了」。
              git commit -m "retrain(rejected): 本轮模型未过门禁，样本存入 eval_rejected/"
            fi
            # 本 job 要跑 30~40 分钟，期间 main 很容易被别的提交推进（人工修复、
            # 其它 bot），直接在旧基线上 push 会被拒 —— 整轮因此判失败，模型白训。
            # 先 rebase 到最新 main 再推，最多重试 3 次。
            for attempt in 1 2 3; do
              if ! git fetch origin main; then
                echo "第 ${attempt} 次 fetch 失败，重试"; sleep 10; continue
              fi
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "第 ${attempt} 次 rebase 失败，重试"; sleep 10; continue
              fi
              if git push origin HEAD:main; then
                echo "已推送（第 ${attempt} 次尝试）"
                pushed=1
                break
              fi
              echo "第 ${attempt} 次 push 被拒，重试"; sleep 15
            done
          fi
          if [ "$pushed" != "1" ]; then
            echo "::error::提交连续 3 次失败（fetch/rebase/push），请检查 main 分支保护或并发冲突"
            exit 1
          fi
          if [ "$EVAL_PASS" != "1" ]; then
            MSG="本轮未发布新模型（评测未达标），拒绝样本见 setup_tuner/resources/models/eval_rejected/"
            # 手动触发时把失败暴露成红灯（有人正等着这个结果）；
            # 定时续抓时不制造噪音，只留告警 —— 报告已落盘可查。
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error title=模型评测未达标::$MSG"
              exit 1
            fi
            echo "::warning title=模型评测未达标::$MSG"
          fi

      # 任何一步挂掉都把诊断写进 ci-status 分支（含 .ci/gate.log 的门禁快照）。
      # 本 job 要跑半小时以上，失败后没有结论等于白等一轮。
      - name: Publish failure diagnostics
        if: failure()
        run: bash scripts/ci_diag.sh "Retrain Models" "retrain"
