name: Audit Load

# 负载驱动性能探测：用仓库已有真实遥测数据还原 60Hz 负载并测量全链路成本（只读）。

on:
  push:
    branches: ["audit/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run load probe
        continue-on-error: true
        shell: bash
        run: python -u scripts/audit_load_probe.py 2>&1 | tee audit_load.log

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-load
          path: |
            load_probe_result.json
            audit_load.log
          if-no-files-found: ignore
          retention-days: 14
