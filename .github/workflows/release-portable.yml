name: Release (Portable)

# 云端构建 Windows 便携包 (Embeddable Python + pip)
# 推送 p* 标签触发 (如 p1.4.1)。全程在 GitHub Actions 云端构建, 不依赖本地。
# 与 release.yml 形成互备方案：若 PyInstaller onedir 在用户机有兼容性问题，
# 可使用此方案获得完整的 "零冻结" 便携包 (约 600MB)。

on:
  push:
    tags: ["p*"]  # 例：git tag p1.4.1 && git push origin p1.4.1

permissions:
  contents: write

jobs:
  build-portable:
    name: build f1opt-portable (windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 下载 Embeddable Python 并构建便携包
        shell: pwsh
        env:
          F1OPT_VERSION: ${{ github.ref_name }}  # e.g. p1.4.1 -> 1.4.1
        run: |
          # 解析版本号
          $ver = $env:F1OPT_VERSION -replace '^p', ''
          
          # 步骤 1: 下载官方 embeddable zip
          $pyVer = "3.11.9"
          $zip = "python-$pyVer-embed-amd64.zip"
          Write-Host "下载 Embeddable Python $pyVer ..."
          Invoke-WebRequest "https://www.python.org/ftp/python/$pyVer/$zip" -OutFile $zip
          
          # 步骤 2: 解压
          $srcDir = "src-portable"
          if (Test-Path $srcDir) { Remove-Item $srcDir -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $srcDir -Force
          Push-Location $srcDir
          
          # 步骤 3: 启用 site-packages (uncomment #import site)
          $pth = "python311._pth"
          (Get-Content $pth) | ForEach-Object {
            if ($_ -match '^#import site') { 'import site' } else { $_ }
          } | Set-Content $pth
          
          # 步骤 4: 引导 pip
          Write-Host "引导 pip ..."
          Invoke-WebRequest "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          & ".\python.exe" get-pip.py --quiet
          Remove-Item get-pip.py -Force
          
          # 步骤 5: 安装项目及依赖
          Write-Host "安装 f1opt + torch ..."
          & ".\python.exe" -m pip install -e $PWD '["dev"]' --quiet
          if ($LASTEXITCODE -ne 0) { throw "pip install 失败" }
          
          # 步骤 6: 冒烟测试
          Write-Host "冒烟测试: python -m f1opt.cli --help ..."
          $result = & ".\python.exe" -m f1opt.cli --help
          if ($LASTEXITCODE -ne 0) { throw "便携包测试失败" }
          
          # 步骤 7: 创建启动器与说明
          $bat = @"
@echo off
cd /d "%%~dp0"
python.exe -m f1opt.cli %%*
"@
          $bat | Out-File -FilePath "f1opt.bat" -Encoding ascii
          
          $readme = @"
F1OPT Portable v$ver
====================

运行方式:
  1. 解压本压缩包到任意目录 (推荐 SSD)
  2. 双击 `f1opt.bat` 即可启动

说明:
  - 基于官方 Embeddable Python 3.11 便携包构建
  - 零 PyInstaller 冻结，彻底避开解压/捆绑失效风险
  - 如曾遇到 onedir 版闪退，此版可靠性更高

环境变量:
  F1OPT_LLM_BACKEND=none|local|openai|builtin
  F1OPT_LLM_MODEL=...
  F1OPT_API_HOST=127.0.0.1
  F1OPT_API_PORT=8000

版本: $ver
构建: GitHub Actions (Windows-latest)
"@
          $readme | Out-File -FilePath "README.md" -Encoding UTF8
          
          # 清理 __pycache__
          Get-ChildItem -Recurse -Directory -Filter "__pycache__" | Remove-Item -Recurse -Force
          
          # ZIP 产物
          $zipName = "f1opt-portable-windows.zip"
          Compress-Archive -Path $srcDir -DestinationPath $zipName -Force
          $sha = (Get-FileHash $zipName -Algorithm SHA256).Hash
          "$sha  $zipName" | Out-File -Encoding ascii "$zipName.sha256"
          
          # 输出变量给下游 step
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "size=$([math]::Round((Get-Item $zipName).Length / 1MB, 1))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          
          Write-Host "产物: $zipName ($([math]::Round((Get-Item $zipName).Length / 1MB, 1)) MiB)"
          Write-Host "SHA256: $sha"
        id: build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: f1opt-portable-windows
          path: |
            f1opt-portable-windows.zip
            f1opt-portable-windows.zip.sha256
          retention-days: 14

      - name: 创建 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          SHA="${{ steps.build.outputs.sha }}"
          SIZE="${{ steps.build.outputs.size }} MiB"
          cat <<EOF > release_notes.md
          # F1OPT ${TAG} (Portable 版)
          
          **Windows 便携包** (Embeddable Python)
          
          ## 使用方法
          1. 下载 \`f1opt-portable-windows.zip\` 并解压
          2. 双击 \`f1opt.bat\` 即可使用
          
          ## 优势
          - 零 PyInstaller 冻结，彻底避免「解压失败导致闪退」问题
          - 直接跑 Python 环境，调试方便
          
          ## 产物
          - ZIP 大小: \`${SIZE}\`
          - SHA256: \`${SHA}\`
          
          本地仅需要 **空格够放**：解压后约 600MB
          
          ## 环境变量
          \`:\`:\`\`\`
          F1OPT_LLM_BACKEND=local     # 本地 Ollama
          F1OPT_LLM_MODEL=llama3.1      # 需先 ollama pull
          F1OPT_LLM_BACKEND=openai      # OpenAI 兼容
          F1OPT_LLM_API_KEY=sk-xxx
          \`:\`\`