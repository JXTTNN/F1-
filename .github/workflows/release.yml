name: Release

# 云端打包 Windows 版 (onedir 文件夹形态) 并发布 GitHub Release。
# 推送 v* tag 触发 (如 v1.4.1)。全程在 GitHub Actions 云端构建, 不依赖本地。
# onedir 而非 onefile: 内置 torch 的超大单文件在部分用户机自解压失败导致闪退。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-exe:
    name: build f1opt.exe (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build onedir EXE folder
        run: pyinstaller exe/f1opt.spec --noconfirm

      - name: Smoke test EXE (--help)
        shell: bash
        run: |
          # onedir 形态: 产物在 dist/f1opt/ 目录, 启动无需自解压
          # (v1.4.0 onefile 在用户机自解压 torch 失败闪退, 故改 onedir)。
          timeout 120 ./dist/f1opt/f1opt.exe --help > help_out.txt 2>&1 || {
            echo 'EXE --help FAILED'; cat help_out.txt; exit 1; }
          head -n 8 help_out.txt

      - name: Zip onedir folder
        shell: pwsh
        run: |
          Compress-Archive -Path dist\f1opt -DestinationPath dist\f1opt-windows.zip -Force
          $h = (Get-FileHash dist\f1opt-windows.zip -Algorithm SHA256).Hash
          "$h  f1opt-windows.zip" | Out-File -Encoding ascii dist\f1opt-windows.zip.sha256
          "sha=$h" >> $env:GITHUB_OUTPUT
          "size=$([math]::Round((Get-Item dist\f1opt-windows.zip).Length / 1MB, 1))" >> $env:GITHUB_OUTPUT
        id: zip

      - name: Compute SHA256 (exe)
        id: hash
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\f1opt\f1opt.exe -Algorithm SHA256).Hash
          "$h  f1opt.exe" | Out-File -Encoding ascii dist\f1opt.exe.sha256
          "sha=$h" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: f1opt-windows-exe
          path: |
            dist/f1opt-windows.zip
            dist/f1opt-windows.zip.sha256
          retention-days: 14

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          SHA="${{ steps.zip.outputs.sha }}"
          SIZE="${{ steps.zip.outputs.size }} MiB"
          {
            echo "F1OPT ${TAG} — Windows 版（解压后双击 f1opt/f1opt.exe，无需安装 Python）"
            echo ""
            echo "> ⚠️ 本版从单文件 EXE 改为 **文件夹 (onedir)** 打包："
            echo "> v1.4.0 单文件版因内置 torch 在部分用户机自解压失败导致闪退，"
            echo "> onedir 形态启动时不再自解压，彻底解决。"
            echo ""
            echo "**使用方法：**"
            echo "1. 下载 \`f1opt-windows.zip\` 并**解压到任意目录**（如桌面）"
            echo "2. 双击 \`f1opt/f1opt.exe\` 即启动（首次启动约 3-10 秒加载模型）"
            echo ""
            echo "- 构建来源: commit ${GITHUB_SHA}"
            echo "- ZIP SHA256: \`${SHA}\`（大小 ${SIZE}）"
            echo "- 云端构建: GitHub Actions windows-latest（Release 工作流）"
            echo ""
            echo "## 内置 LLM 配置（可选）"
            echo ""
            echo "反馈引擎支持 LLM 增强（默认规则引擎，降级已内置）："
            echo ""
            echo '```'
            echo "# 方式 A: 本地 Ollama (内置 local 后端, 免费)"
            echo "F1OPT_LLM_BACKEND=local"
            echo "F1OPT_LLM_MODEL=llama3.1   # 需先 ollama pull llama3.1"
            echo ""
            echo "# 方式 B: OpenAI 兼容云端"
            echo "F1OPT_LLM_BACKEND=openai"
            echo "F1OPT_LLM_API_KEY=sk-..."
            echo "F1OPT_LLM_MODEL=gpt-4o-mini"
            echo '```'
            echo ""
            echo "写在 f1opt.exe 同目录 \`.env\` 文件或系统环境变量均可。"
            echo "跑圈实时反馈走规则引擎（零延迟）；停表后分析自动启用 LLM 改写。"
          } > release_notes.md
          gh release create "$TAG" dist/f1opt-windows.zip dist/f1opt-windows.zip.sha256 \
            --title "$TAG" --notes-file release_notes.md

  exe-human-audit:
    name: "EXE 全量真人测试 (windows)"
    needs: build-exe
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/download-artifact@v4
        with:
          name: f1opt-windows-exe
          path: dist

      - name: Unzip onedir folder
        shell: pwsh
        run: |
          Expand-Archive -Path dist\f1opt-windows.zip -DestinationPath dist -Force
          if (-not (Test-Path dist\f1opt\f1opt.exe)) { Write-Error 'f1opt/f1opt.exe not found after unzip'; exit 1 }
          Get-ChildItem dist\f1opt | Select-Object -First 8

      - name: Install audit deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      # Opt-EXE-AUDIT: Windows runner 在每个 step 结束时会清理该 step 启动的
      # 进程树 —— EXE 服务器与审计必须同处一个 step, 否则 Boot 一结束 EXE
      # 即被杀, 审计必然 CONNECTION REFUSED (实测复现于 v1.3.0 首跑)。
      - name: Boot EXE + full UI human audit (single step)
        shell: bash
        env:
          PYTHONIOENCODING: "utf-8"
          F1OPT_LLM_BACKEND: "builtin"
        run: |
          set -e
          F1OPT_API_HOST=127.0.0.1 F1OPT_API_PORT=8000 \
            ./dist/f1opt/f1opt.exe serve > server.log 2>&1 &
          echo $! > exe.pid
          up=0
          for i in $(seq 1 240); do
            if curl -sf http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "EXE server up after ${i}s (one-file 自解压 + torch 加载)"
              up=1
              break
            fi
            sleep 1
          done
          if [ "$up" != "1" ]; then
            echo 'EXE server failed to start within 240s'
            tail -n 60 server.log || true
            exit 1
          fi
          # 停表后预加载内置小模型 (与产品语义一致)
          curl -s -X POST http://127.0.0.1:8000/api/llm/preload || true
          AUDIT_LLM_BACKEND=builtin python -u cloud_audit/ui_click_audit.py

      - name: Shutdown EXE
        if: always()
        shell: bash
        run: taskkill //F //IM f1opt.exe || echo 'no f1opt process'

      - name: Upload EXE audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exe-ui-audit
          path: |
            reports/
            shots/
            server.log
            server.err
          if-no-files-found: ignore
          retention-days: 14
