name: Release

# 云端打包 Windows 单文件 EXE 并发布 GitHub Release。
# 推送 v* tag 触发 (如 v1.2.2)。全程在 GitHub Actions 云端构建, 不依赖本地。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-exe:
    name: build f1opt.exe (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build one-file EXE
        run: pyinstaller exe/f1opt.spec --noconfirm

      - name: Smoke test EXE (--help)
        shell: bash
        run: |
          # one-file 自解压需数秒, 给足超时; --help 必须成功退出。
          timeout 120 ./dist/f1opt.exe --help > help_out.txt 2>&1 || {
            echo 'EXE --help FAILED'; cat help_out.txt; exit 1; }
          head -n 8 help_out.txt

      - name: Compute SHA256
        id: hash
        shell: pwsh
        run: |
          $h = (Get-FileHash dist\f1opt.exe -Algorithm SHA256).Hash
          $mib = [math]::Round((Get-Item dist\f1opt.exe).Length / 1MB, 1)
          "$h  f1opt.exe" | Out-File -Encoding ascii dist\f1opt.exe.sha256
          "sha=$h"     >> $env:GITHUB_OUTPUT
          "size=$mib"  >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: f1opt-windows-exe
          path: |
            dist/f1opt.exe
            dist/f1opt.exe.sha256
          retention-days: 14

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          SHA="${{ steps.hash.outputs.sha }}"
          SIZE="${{ steps.hash.outputs.size }} MiB"
          {
            echo "F1OPT ${TAG} — Windows 单文件 EXE（无需安装 Python，双击即用）"
            echo ""
            echo "- 构建来源: commit ${GITHUB_SHA}"
            echo "- SHA256: \`${SHA}\`（大小 ${SIZE}）"
            echo "- 云端构建: GitHub Actions windows-latest（Release 工作流）"
            echo ""
            echo "## 内置 LLM 配置（可选）"
            echo ""
            echo "反馈引擎支持 LLM 增强（默认规则引擎，缺一不可的降级已内置）："
            echo ""
            echo '```'
            echo "# 方式 A: 本地 Ollama (内置 local 后端, 免费)"
            echo "F1OPT_LLM_BACKEND=local"
            echo "F1OPT_LLM_MODEL=llama3.1   # 需先 ollama pull llama3.1"
            echo ""
            echo "# 方式 B: OpenAI 兼容云端"
            echo "F1OPT_LLM_BACKEND=openai"
            echo "F1OPT_LLM_API_KEY=sk-..."
            echo "F1OPT_LLM_MODEL=gpt-4o-mini"
            echo '```'
            echo ""
            echo "写在 EXE 同目录 \`.env\` 文件或系统环境变量均可。"
            echo "跑圈实时反馈走规则引擎（零延迟）；停表后分析自动启用 LLM 改写。"
          } > release_notes.md
          gh release create "$TAG" dist/f1opt.exe dist/f1opt.exe.sha256 \
            --title "$TAG" --notes-file release_notes.md
