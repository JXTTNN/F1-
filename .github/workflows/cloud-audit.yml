name: Cloud Audit

# 云端全量测试 + 真人式 UI 审计（仅点击 UI / 仅输入框输入）。
# 全部在 GitHub Actions 云端执行，结果汇总为 Issue 与 artifact。

on:
  push:
    branches: [main, cloud-audit]
  workflow_dispatch:
    inputs:
      suite:
        description: "all | tests | ui"
        required: false
        default: "all"

permissions:
  contents: read
  issues: write

jobs:
  # ---------------------------------------------------------------- tests
  tests:
    name: "pytest :: ${{ matrix.group }}"
    if: github.event.inputs.suite != 'ui'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        group: [api, misc, e2e, feedback, model, telemetry, ui, root]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-xdist pytest-timeout

      - name: Run group
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reports
          G="${{ matrix.group }}"
          if [ "$G" = "root" ]; then
            TARGET="tests/test_cli.py tests/test_e2e_scenarios.py tests/test_full_pipeline_validation.py tests/test_input_pipeline_validation.py tests/test_robustness.py tests/test_robustness_validation.py tests/test_smoke.py tests/test_stress_comprehensive.py"
          elif [ "$G" = "misc" ]; then
            TARGET="tests/data tests/driver tests/observability"
          else
            TARGET="tests/$G"
          fi
          echo "TARGET=$TARGET"
          python -u -X faulthandler -m pytest -n 4 $TARGET -v --timeout=300 \
            -o junit_family=xunit2 --junitxml="reports/$G.xml"

      - name: Upload group report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "report-${{ matrix.group }}"
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------------------------- ui
  ui:
    name: "ui :: real-click audit"
    if: github.event.inputs.suite != 'tests'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install playwright
          playwright install --with-deps chromium

      - name: Boot API server
        shell: bash
        run: |
          mkdir -p data_store
          F1OPT_API_HOST=127.0.0.1 F1OPT_API_PORT=8000 F1OPT_UDP_PORT=20777 \
            F1OPT_LLM_BACKEND=builtin \
            nohup python -u -m f1opt.api.runner > server.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "server up after ${i}s"; break
            fi
            sleep 1
          done
          echo '--- /api/health ---'
          curl -s http://127.0.0.1:8000/api/health || echo 'HEALTH UNAVAILABLE'
          # 内置小模型审计: 停表后显式预加载 (启用 _llm_loaded, 与游戏内
          # 「跑圈只走规则引擎、停表后再启用 LLM」的产品语义一致)。
          echo '--- POST /api/llm/preload ---'
          curl -s -X POST http://127.0.0.1:8000/api/llm/preload || echo 'LLM PRELOAD FAILED'

      - name: Run UI click audit
        continue-on-error: true
        run: AUDIT_LLM_BACKEND=builtin python -u cloud_audit/ui_click_audit.py

      - name: Dump server log tail
        if: always()
        run: |
          echo '--- server.log (tail 200) ---'
          tail -n 200 server.log || true

      - name: Upload UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-ui-audit
          path: |
            reports/
            shots/
            server.log
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------------- report
  report:
    name: aggregate + publish
    needs: [tests, ui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ruff static snapshot
        if: always()
        continue-on-error: true
        run: |
          python -m pip install -q ruff
          mkdir -p reports
          ruff check f1opt cloud_audit --output-format concise > reports/ruff.txt 2>&1 || true
          echo "ruff lines: $(wc -l < reports/ruff.txt)"
          head -n 60 reports/ruff.txt

      - name: Build report
        run: |
          python -u cloud_audit/build_report.py
          echo '--- report head ---'
          head -n 120 reports/AUDIT_REPORT.md || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-audit-report
          path: reports/AUDIT_REPORT.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f reports/ISSUE_BODY.md ]; then echo 'no issue body'; exit 0; fi
          gh issue create --repo JXTTNN/F1- \
            --title "$(head -n 1 reports/ISSUE_TITLE.txt)" \
            --body-file reports/ISSUE_BODY.md || echo 'issue create failed'
