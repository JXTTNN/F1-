name: Cloud Audit

# 云端全量测试 + 真人式 UI 审计（仅点击 UI / 仅输入框输入）。
# 全部在 GitHub Actions 云端执行。
#
# 2026-11 修订（Issue 噪音）：
#   此前 "Publish issue" 步骤是 if: always() 且无条件 gh issue create，
#   于是**每次全绿也开一条 issue** —— 仓库累计 74 条 open issue 里 73 条都是
#   「云端全量审计：✅ 全绿」，真正的失败项（#77）被彻底淹没。
#   现在：全绿只写 Job Summary（附 artifact），失败才开 issue；
#   并顺带归档历史遗留的全绿 issue（幂等，可反复跑）。

on:
  push:
    branches: [main, cloud-audit]
  workflow_dispatch:
    inputs:
      suite:
        description: "all | tests | ui"
        required: false
        default: "all"

permissions:
  contents: read
  issues: write

jobs:
  # ---------------------------------------------------------------- tests
  tests:
    name: "pytest :: full"
    if: github.event.inputs.suite != 'ui'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run all tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p reports
          pytest tests/ -v --timeout=300 \
            -o junit_family=xunit2 --junitxml="reports/full.xml"

      - name: Upload group report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: "report-full"
          path: reports/
          if-no-files-found: ignore
          retention-days: 7

  # ------------------------------------------------------------------- ui
  ui:
    name: "ui :: real-click audit"
    if: github.event.inputs.suite != 'tests'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install playwright
          playwright install --with-deps chromium

      - name: Boot API server
        shell: bash
        run: |
          mkdir -p data_store
          API_HOST=127.0.0.1 API_PORT=8000 UDP_PORT=20777 \
            nohup uvicorn setup_tuner.app:create_app --factory --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8000/api/v1/health >/dev/null 2>&1; then
              echo "server up after ${i}s"; break
            fi
            sleep 1
          done
          echo '--- /api/v1/health ---'
          curl -s http://127.0.0.1:8000/api/v1/health || echo 'HEALTH UNAVAILABLE'

      - name: Run UI click audit
        # task-62：审计已重写为现役 UI 真实主流程 → 改为阻断（H4 修复）
        run: python -u cloud_audit/ui_click_audit.py

      - name: Dump server log tail
        if: always()
        run: |
          echo '--- server.log (tail 200) ---'
          tail -n 200 server.log || true

      - name: Upload UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-ui-audit
          path: |
            reports/
            shots/
            server.log
          if-no-files-found: ignore
          retention-days: 7

  # --------------------------------------------------------------- report
  report:
    name: aggregate + publish
    needs: [tests, ui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ruff static snapshot
        if: always()
        continue-on-error: true
        run: |
          python -m pip install -q ruff
          mkdir -p reports
          ruff check setup_tuner/ tests/ cloud_audit/ --output-format concise > reports/ruff.txt 2>&1 || true
          echo "ruff lines: $(wc -l < reports/ruff.txt)"
          head -n 60 reports/ruff.txt

      - name: Build report
        run: |
          python -u cloud_audit/build_report.py
          echo '--- report head ---'
          head -n 120 reports/AUDIT_REPORT.md || true

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-audit-report
          path: reports/AUDIT_REPORT.md
          if-no-files-found: ignore
          retention-days: 14

      # 全绿：只写 Job Summary，不开 issue（查看入口：Actions 运行页 + artifact）。
      # 失败：开一条 issue，带上失败摘要（标题由 build_report.py 生成）。
      - name: Publish (summary on green, issue on failure)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          if [ ! -f reports/ISSUE_TITLE.txt ]; then
            echo 'no issue title, skip publish'
            exit 0
          fi
          TITLE="$(head -n 1 reports/ISSUE_TITLE.txt)"
          echo "## 审计标题：$TITLE" >> "$GITHUB_STEP_SUMMARY"

          if [ -f reports/AUDIT_REPORT.md ]; then
            head -n 200 reports/AUDIT_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          fi

          if printf '%s' "$TITLE" | grep -q '全绿'; then
            echo ""
            echo "结果：✅ 全绿 —— 仅记录到 Job Summary，不创建 issue。"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> 全绿结果只保留在本 Job Summary 与 artifact 中，不再刷 issue。" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "结果：❌ 存在失败项 —— 创建 issue 以便跟进。"
          gh issue create --repo JXTTNN/F1- \
            --title "$TITLE" \
            --body-file reports/ISSUE_BODY.md || echo 'issue create failed'

      # 归档历史遗留的全绿 issue（幂等；只关标题含「全绿」的，绝不碰真实失败项）。
      - name: Archive green audit issues
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          nums=$(gh issue list --repo JXTTNN/F1- --state open --limit 300 \
                   --json number,title \
                   --jq '.[] | select(.title | contains("全绿")) | .number' || true)
          if [ -z "$nums" ]; then
            echo '没有需要归档的全绿 issue'
            exit 0
          fi
          count=0
          for n in $nums; do
            gh issue close "$n" --repo JXTTNN/F1- --reason "not planned" \
              --comment "自动归档：全绿审计结果改为写入 Actions Job Summary，不再占用 issue 追踪。" \
              && count=$((count + 1)) || echo "close #$n failed"
          done
          echo "已归档 $count 条全绿 issue"
