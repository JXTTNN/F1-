name: Setup Laps

# 抓取真实「调教 → 圈速」配对（F1Laps 公开社区调教库），并用它校准调教性能模型。
#
# 为什么需要独立 workflow：
#   - 抓取是慢 IO（每站 20 条详情页，限速 1.2s），塞进 retrain 会把 30 分钟的
#     重训拖到 50 分钟；
#   - 数据每周才需要刷新一次，而模型重训是每 6 小时；
#   - 抓回来的数据要入库（`data/setup_laps/`），与模型产物分开提交更清晰。
#
# 合规：只访问公开 HTML 页面，robots.txt 明确 `Content-Signal: ai-train=yes`，
# 不触碰 `/api/` 与登录区；默认 1.2 秒/请求限速。

on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "抓取时间预算（分钟），到点停止并可下次续传"
        required: false
        default: "25"
      skip_fetch:
        description: "只跑校准，不抓新数据"
        type: boolean
        required: false
        default: false
  schedule:
    - cron: "23 3 * * 1"   # 每周一 03:23 UTC
  push:
    branches: [main]
    paths:
      - "scripts/fetch_setup_laps.py"
      - "scripts/calibrate_sim_with_real_laps.py"
      - "scripts/train_real_lap_model.py"
      - ".github/workflows/setup-laps.yml"

permissions:
  contents: write

concurrency:
  group: setup-laps
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # 抓取前对齐远端：checkout 拿到的是触发时的 SHA，而抓取要跑 20+ 分钟，
      # 期间别的工作流可能已经往 data/setup_laps/ 提交过数据。本地落后时生成的
      # 文件与远端不同 → 提交阶段 rebase 冲突 → 整个 job 判红（实测 #3）。
      # 先快进到最新，抓取的去重逻辑会自动跳过已入库的条目。
      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          if git merge --ff-only origin/main; then
            echo "已快进到 origin/main"
          else
            echo "::warning::无法快进（本地有改动），继续用当前基线"
          fi

      # 已抓到的样本入库在 data/setup_laps/；缓存只是为中断续传兜底。
      - name: Restore fetch cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/setup_laps/_fetch_state.json
            data/setup_laps/f1laps_setups.jsonl
          key: setup-laps-${{ github.run_id }}
          restore-keys: setup-laps-

      - name: Fetch real setup → lap pairs
        if: github.event.inputs.skip_fetch != 'true'
        shell: bash
        run: |
          set -o pipefail
          python scripts/fetch_setup_laps.py --all-slices --sleep 0.6 \
            --max-minutes "${{ github.event.inputs.max_minutes || '55' }}" 2>&1 | tee fetch.log
          echo '--- 概况 ---'
          python scripts/fetch_setup_laps.py --summary || true

      - name: Save fetch cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/setup_laps/_fetch_state.json
            data/setup_laps/f1laps_setups.jsonl
          key: setup-laps-${{ github.run_id }}

      # 校准不是门禁：它的作用是「给出真实性与量级的结论」，不是拦截发布。
      # 让 job 因校准结论变红会逼着人关掉这道检查。
      - name: Calibrate sim against real laps
        continue-on-error: true
        shell: bash
        run: |
          python scripts/calibrate_sim_with_real_laps.py 2>&1 | tee calibrate.log || true
          echo '--- 结论 ---'
          python - <<'PY' || true
          import json, pathlib
          p = pathlib.Path('data/setup_laps/calibration_report.json')
          if not p.exists():
              print('未生成校准报告')
              raise SystemExit(0)
          r = json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps(r['summary'], ensure_ascii=False, indent=2))
          for v in r['verdict']:
              print(f'- {v}')
          PY

      # 训练真实校准模型：这是唯一使用**外部真值**的模型层。
      # 它不是门禁，但它的结论（留出集成对排序）决定 blend_weight：
      # 真实模型打不过仿真时权重自动为 0，不会破坏现有行为。
      - name: Train real-lap calibration model
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/train_real_lap_model.py --min-per-track 20 2>&1 | tee train_real.log

      # 零泄漏验收：K 折的配对可能跨折，折间的标准化偏移会给指标带进水分。
      # 留一赛道（该站完全不参与训练）与跨年迁移是唯一能证明「模型学到的是
      # 可外推规律、不是记住数据」的检验，因此与训练同等重要。
      - name: Zero-leak holdout check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/eval_real_lap_model.py 2>&1 | tee holdout.log

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-laps-report
          path: |
            data/setup_laps/calibration_report.json
            data/setup_laps/calibration_report.md
            data/setup_laps/real_lap_report.json
            data/setup_laps/real_lap_report.md
            data/setup_laps/real_lap_holdout.json
            data/setup_laps/real_lap_holdout.md
            data/setup_laps/f1laps_setups.jsonl
            setup_tuner/resources/models/real_lap_calibration.json
            fetch.log
            calibrate.log
            train_real.log
            holdout.log
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit data and report
        # 提交是「顺带存证」：数据与报告都已上传 artifact，推送撞车不该让整轮
        # 判红（真实失败由上一层的抓取/校准步骤暴露）。
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "setup-laps-bot"
          git config user.email "setup-laps-bot@users.noreply.github.com"
          git add data/setup_laps/f1laps_setups.jsonl \
                  data/setup_laps/calibration_report.json \
                  data/setup_laps/calibration_report.md \
                  data/setup_laps/real_lap_report.json \
                  data/setup_laps/real_lap_report.md \
                  data/setup_laps/real_lap_holdout.json \
                  data/setup_laps/real_lap_holdout.md \
                  setup_tuner/resources/models/real_lap_calibration.json 2>/dev/null || true
          git add data/setup_laps/_fetch_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
            exit 0
          fi
          N=$(wc -l < data/setup_laps/f1laps_setups.jsonl || echo 0)
          ACC=$(python -c "import json;print(json.load(open('data/setup_laps/real_lap_report.json'))['metrics']['matched_acc_real'])" 2>/dev/null || echo "n/a")
          git commit -m "data(setup-laps): 真实配对 ${N} 条 + 校准模型（配对排序 ${ACC}）"
          for attempt in 1 2 3; do
            if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then
              echo "已推送（第 ${attempt} 次尝试）"
              exit 0
            fi
            git rebase --abort || true
            echo "第 ${attempt} 次失败，重试"
            sleep 10
          done
          echo "::error::提交连续 3 次失败"
          exit 1

      # 结论必须进 Job Summary：校准的价值就在于它可能推翻「模型很准」的说法，
      # 埋在 artifact 里没人会看。
      - name: Write summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 真实调教 → 圈速 校准"
            echo
            if [ -f data/setup_laps/real_lap_report.md ]; then
              cat data/setup_laps/real_lap_report.md
            elif [ -f data/setup_laps/calibration_report.md ]; then
              cat data/setup_laps/calibration_report.md
            else
              echo "未生成校准报告（抓取或依赖失败，见 fetch.log / calibrate.log）"
            fi
            echo
            if [ -f data/setup_laps/real_lap_holdout.md ]; then
              cat data/setup_laps/real_lap_holdout.md
            else
              echo "_未生成零泄漏检验报告（见 holdout.log）_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
