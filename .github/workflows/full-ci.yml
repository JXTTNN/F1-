name: Full CI

# 全量测试套件云端验证。ci.yml 只跑 5 个快测文件保反馈速度；本工作流跑完整 tests/ 树。
# Opt-007: 按目录矩阵分片（此前单进程跑到 ~76% 进程消失，无 pytest 总结 —— 疑似 OOM/硬崩。
#          分片后每个作业独立日志、独立内存上限；-v 打印用例名，硬崩时最后一条即现场。）

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  full-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group:
          - api
          - data
          - driver
          - e2e
          - feedback
          - model
          - observability
          - telemetry
          - ui
          - root
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test group api
        if: matrix.group == 'api'
        run: pytest tests/api -v --timeout=240

      - name: Test group data
        if: matrix.group == 'data'
        run: pytest tests/data -v --timeout=240

      - name: Test group driver
        if: matrix.group == 'driver'
        run: pytest tests/driver -v --timeout=240

      - name: Test group e2e
        if: matrix.group == 'e2e'
        run: pytest tests/e2e -v --timeout=240

      - name: Test group feedback
        if: matrix.group == 'feedback'
        run: pytest tests/feedback -v --timeout=240

      - name: Test group model
        if: matrix.group == 'model'
        run: pytest tests/model -v --timeout=240

      - name: Test group observability
        if: matrix.group == 'observability'
        run: pytest tests/observability -v --timeout=240

      - name: Test group telemetry
        if: matrix.group == 'telemetry'
        run: pytest tests/telemetry -v --timeout=240

      - name: Test group ui
        if: matrix.group == 'ui'
        run: pytest tests/ui -v --timeout=240

      # Opt-008: root 组分步直跑（python -u 关缓冲 + faulthandler 抓段错误），
      # 进程被杀时最后一条 -v 输出即现场（此前合并一步跑，被杀后尾部被缓冲吞掉无法定位）。
      - name: Test root: cli
        if: matrix.group == 'root'
        run: python -u -X faulthandler -m pytest tests/test_cli.py -v --timeout=240

      - name: Test root: e2e_scenarios
        if: matrix.group == 'root'
        run: python -u -X faulthandler -m pytest tests/test_e2e_scenarios.py -v --timeout=240

      - name: Test root: full_pipeline_validation
        if: matrix.group == 'root'
        run: python -u -X faulthandler -m pytest tests/test_full_pipeline_validation.py -v --timeout=240

      - name: Test root: input_pipeline_validation
        if: matrix.group == 'root'
        run: python -u -X faulthandler -m pytest tests/test_input_pipeline_validation.py -v --timeout=240

      - name: Test root: robustness
        if: matrix.group == 'root'
        run: python -u -X faulthandler -m pytest tests/test_robustness.py -v --timeout=240

      - name: Test root: robustness_validation
        if: matrix.group == 'root'
        run: python -u -X faulthandler -m pytest tests/test_robustness_validation.py -v --timeout=240

      - name: Test root: smoke
        if: matrix.group == 'root'
        run: python -u -X faulthandler -m pytest tests/test_smoke.py -v --timeout=240

      - name: Test root: stress_comprehensive
        if: matrix.group == 'root'
        run: python -u -X faulthandler -m pytest tests/test_stress_comprehensive.py -v --timeout=240

