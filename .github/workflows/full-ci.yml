name: Full CI

# 全量测试套件云端验证。ci.yml 做 lint + 快速回归；本工作流跑完整 tests/ 树。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 诊断要写进 ci-status 分支

# 同一分支只保留最新一次（理由见 ci.yml）。
concurrency:
  group: full-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-test:
    runs-on: ubuntu-latest
    # 整套用例（含 deep_integration / deep_slice）在 2 核 runner 上要跑半小时量级，
    # 旧的 30 分钟上限会把「跑得慢」误判成「测试挂了」—— cloud-audit 的同名 job
    # 一直给的是 40 分钟，这里对齐并留余量。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run all tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci
          pytest tests/ -v --timeout=300 --durations=15 2>&1 | tee .ci/pytest.log

      - name: Publish CI diagnostics
        if: always()
        run: bash scripts/ci_diag.sh "Full CI" "full-test"
