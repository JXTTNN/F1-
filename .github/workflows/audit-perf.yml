name: Audit Perf

# 只读性能 & 个性化能力探针（云端运行，不改动生产代码）。

on:
  push:
    branches: ["audit/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run perf probe
        continue-on-error: true
        shell: bash
        run: python -u scripts/audit_perf_probe.py 2>&1 | tee audit_perf.log

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-perf
          path: |
            perf_probe_result.json
            audit_perf.log
          if-no-files-found: ignore
          retention-days: 14
