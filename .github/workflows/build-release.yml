name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka
          pip install -e ".[dev,build]"
          python -m nuitka --version

      - name: Build with Nuitka
        run: python scripts/build_nuitka.py

      - name: Test portable exe
        id: test
        run: python scripts/test_portable_exe.py
        continue-on-error: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: F1OPT-test-report
          path: dist/test-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail job if tests failed
        if: steps.test.outcome == 'failure'
        run: |
          echo "::error::打包产物测试失败，详见 F1OPT-test-report artifact"
          exit 1

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: F1OPT-portable
          path: dist/F1OPT-portable.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && steps.test.outcome == 'success'
        with:
          files: dist/F1OPT-portable.zip
          draft: false
          prerelease: false

      # 无论成败都把打包结论写进 ci-status 分支。dist/test-report.json 是「准确
      # 打包」唯一可断言的东西（model_type 必须是 nn、sim.available 必须为真、
      # 数据必须落在解压目录内）；只在失败时才写，等于发布出去的东西没有凭证。
      # 本步只做记录，绝不反过来把已成功的发布判成失败（结尾固定 exit 0）。
      - name: Publish build diagnostics
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          git config user.name "ci-status-bot"
          git config user.email "ci-status-bot@users.noreply.github.com"
          New-Item -ItemType Directory -Force -Path ci-status | Out-Null
          $out = "ci-status/Build_Release__build.txt"

          $zip = "缺失"
          if (Test-Path dist/F1OPT-portable.zip) {
            $zip = "{0:N2} MB" -f ((Get-Item dist/F1OPT-portable.zip).Length / 1MB)
          }

          "workflow   : Build & Release"            | Out-File -FilePath $out -Encoding utf8
          "sha        : $env:GITHUB_SHA"            | Out-File -FilePath $out -Append -Encoding utf8
          "ref        : $env:GITHUB_REF_NAME"       | Out-File -FilePath $out -Append -Encoding utf8
          "test step  : ${{ steps.test.outcome }}"  | Out-File -FilePath $out -Append -Encoding utf8
          "zip size   : $zip"                       | Out-File -FilePath $out -Append -Encoding utf8

          if (Test-Path dist/test-report.json) {
            "---- dist/test-report.json ----" | Out-File -FilePath $out -Append -Encoding utf8
            Get-Content dist/test-report.json -Raw | Out-File -FilePath $out -Append -Encoding utf8
          } else {
            "(没有 dist/test-report.json —— 失败发生在打包或测试启动之前)" |
              Out-File -FilePath $out -Append -Encoding utf8
          }

          # 以远端 ci-status 的树为基线叠加本 job 的文件（不整分支覆盖）：
          # CI / Full CI / Retrain 也在写这个分支，各自强推会互相覆盖。
          $base = ""
          git fetch -q origin ci-status:refs/remotes/origin/ci-status 2>$null
          if ($LASTEXITCODE -eq 0) {
            $base = (git rev-parse --verify -q refs/remotes/origin/ci-status)
          }
          if ($base) { git read-tree $base | Out-Null } else { git read-tree --empty | Out-Null }
          git add -f ci-status | Out-Null
          $tree = (git write-tree)
          $msg = "ci-status: build @ $($env:GITHUB_SHA.Substring(0,7))"
          if ($base) {
            $commit = (git commit-tree $tree -p $base -m $msg)
          } else {
            $commit = (git commit-tree $tree -m $msg)
          }
          git push -f origin "$commit`:refs/heads/ci-status"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::诊断写入 ci-status 分支失败（不影响发布结论）"
          }
          exit 0