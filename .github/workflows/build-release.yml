name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka
          pip install -e ".[dev,build]"
          python -m nuitka --version

      - name: Build with Nuitka
        run: python scripts/build_nuitka.py

      - name: Test portable exe
        id: test
        run: python scripts/test_portable_exe.py
        continue-on-error: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: F1OPT-test-report
          path: dist/test-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Fail job if tests failed
        if: steps.test.outcome == 'failure'
        run: |
          echo "::error::打包产物测试失败，详见 F1OPT-test-report artifact"
          exit 1

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: F1OPT-portable
          path: dist/F1OPT-portable.zip
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') && steps.test.outcome == 'success'
        with:
          files: dist/F1OPT-portable.zip
          draft: false
          prerelease: false
