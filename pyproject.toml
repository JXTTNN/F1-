[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "setup_tuner"
version = "1.6.10"
description = "F1OPT 赛车调教优化助手 - EA F1 2026 Setup Tuner"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "F1OPT Team" }]
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pydantic>=2",
    "structlog>=20.1",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "ruff",
    "mypy",
    "httpx",
]
build = [
    "nuitka",
]

[project.scripts]
f1opt = "setup_tuner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["setup_tuner*"]
exclude = ["tests*", "legacy*", "data_store*"]

# 打包静态 UI 资源（SVG 赛道图 + HTML/JS/CSS）+ SQLite schema + 模型产物
# 模型必须随包分发：仓库根的 data/models/ 在 pip 安装后不存在，
# 不打包会导致"装好了却找不到模型、静默降级为纯规则"。
[tool.setuptools.package-data]
"setup_tuner.ui" = ["tracks/*", "*"]
"setup_tuner.db" = ["*.sql"]
"setup_tuner.resources" = ["models/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
# legacy/ 是重构前的旧实现存档（见 legacy/README.md）：只读参考区，
# 不属于 setup_tuner 运行时，也不应参与 lint —— 否则 `ruff check .`
# 会被 270+ 条历史噪音淹没，真正的回归反而看不见。
exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"setup_tuner/**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["setup_tuner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
check_untyped_defs = false

# --- coverage ---
[tool.coverage.run]
source = ["setup_tuner"]
branch = true
parallel = true
omit = [
    "setup_tuner/__init__.py",
    "*/__pycache__/*",
    "tests/*",
    "scripts/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
