[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "setup_tuner"
version = "0.1.0"
description = "F1OPT 赛车调教优化助手 - EA F1 2026 Setup Tuner"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "F1OPT Team" }]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "structlog",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "ruff",
    "mypy",
    "httpx",
]
build = [
    "nuitka",
]

[project.scripts]
f1opt = "setup_tuner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["setup_tuner*"]
exclude = ["tests*", "legacy*", "data_store*"]

# 打包静态 UI 资源（SVG 赛道图 + HTML/JS/CSS）
[tool.setuptools.package-data]
"setup_tuner.ui" = ["tracks/*", "*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"setup_tuner/**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["setup_tuner"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
check_untyped_defs = false

# --- coverage ---
[tool.coverage.run]
source = ["setup_tuner"]
branch = true
parallel = true
omit = [
    "setup_tuner/__init__.py",
    "*/__pycache__/*",
    "tests/*",
    "scripts/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
