[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1opt"
version = "0.1.1"
description = "F1 2026 Setup Optimizer: real-time telemetry, AI driver feedback, and setup search"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "F1OPT Team" }]
keywords = ["f1", "formula-1", "telemetry", "setup-optimizer", "racing", "simulation", "machine-learning", "bayesian-optimization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Simulation",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/JXTTNN/F1-"
"Bug Reports" = "https://github.com/JXTTNN/F1-/issues"
"Source Code" = "https://github.com/JXTTNN/F1-"

[project.scripts]
f1opt = "f1opt.cli:main"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pyarrow",
    "torch",
    "numpy",
    "httpx",
    "websockets",
    "structlog",
    "slowapi",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp-proto-grpc",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
]
win = [
    "pywin32>=306; platform_system == 'Windows'",
    "windows-curses>=2.3; platform_system == 'Windows'",
]
llm = [
    "openai>=1.0",
    "langchain>=0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["f1opt*"]
exclude = ["tests*", "data_store*", ".trae*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"f1opt/**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["f1opt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
check_untyped_defs = false

[[tool.mypy.overrides]]
module = ["torch.*", "pyarrow.*", "opentelemetry.*", "ollama.*", "langchain.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["f1opt"]
branch = true
parallel = true
omit = [
    "f1opt/__init__.py",
    "*/__pycache__/*",
    "tests/*",
    "scripts/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
skip_empty = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "@(abc\\\\.)?abstractmethod",
    "\\.\\.\\.",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
